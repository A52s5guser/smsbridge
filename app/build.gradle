plugins {
    id 'com.android.application'
}

android {
    namespace 'com.smsbridge'
    compileSdk 36

    defaultConfig {
        applicationId "com.smsbridge"
        minSdk 33
        targetSdk 36
        versionCode 5
        versionName "0.5.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}